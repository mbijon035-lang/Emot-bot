<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App with Background & Animation</title>
    <style>
        /* ========== BACKGROUND COLORS ========== */
        body {
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Neon Green Theme */
        .neon-border {
            border: 1px solid #00ff00;
        }
        
        .neon-glow {
            box-shadow: 0 0 10px #00ff00;
        }
        
        .dark-card {
            background: rgba(0, 30, 0, 0.8);
        }
        
        /* Text Colors */
        .neon-text {
            color: #00ff00;
            text-shadow: 0 0 5px #00ff00;
        }
        
        .warning-text {
            color: #ff9900;
        }
        
        .success-text {
            color: #00ff00;
        }
        
        .error-text {
            color: #ff0000;
        }
        
        /* Button Colors */
        .neon-btn {
            background: linear-gradient(135deg, #00ff00, #009900);
            color: #000000;
        }
        
        .secondary-btn {
            background: linear-gradient(135deg, #666666, #333333);
            color: #00ff00;
        }
        
        /* ========== ANIMATIONS ========== */
        /* Matrix Background Animation */
        .matrix-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.3;
        }
        
        /* Glitch Text Animation */
        .glitch {
            animation: glitch 1s linear infinite;
        }
        
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
        
        /* Slide In Animation */
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        /* Pulse Animation */
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 0, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(0, 255, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 0, 0); }
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        /* Float Animation */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .float {
            animation: float 3s ease-in-out infinite;
        }
        
        /* Spin Animation */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .spin {
            animation: spin 2s linear infinite;
        }
        
        /* Scanning Line Animation */
        .scan-line {
            position: relative;
            overflow: hidden;
        }
        
        .scan-line::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00ff00, transparent);
            animation: scan 2s linear infinite;
        }
        
        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(400%); }
        }
        
        /* ========== HOVER EFFECTS ========== */
        /* Button Hover */
        .neon-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px #00ff00;
            transition: all 0.3s ease;
        }
        
        /* Card Hover */
        .hover-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 25px #00ff00;
            transition: all 0.3s ease;
        }
        
        /* Link Hover */
        .neon-link:hover {
            color: #000000;
            background: #00ff00;
            box-shadow: 0 0 15px #00ff00;
            transition: all 0.3s ease;
        }
        
        /* Input Focus */
        .neon-input:focus {
            outline: none;
            border-color: #00ff00;
            box-shadow: 0 0 10px #00ff00;
        }
    </style>
</head>
<body>
    <!-- Matrix Background Canvas -->
    <canvas id="matrixCanvas" class="matrix-effect"></canvas>
    
    <!-- Example Content -->
    <div style="max-width: 800px; margin: 50px auto; padding: 20px;">
        <!-- Glitch Title -->
        <h1 class="glitch neon-text" style="text-align: center;">APP TITLE</h1>
                             
       
        
        <!-- Notification Example -->
        <div id="notification" style="
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, #00ff00, #009900);
            color: #000;
            padding: 15px 25px;
            border-radius: 10px;
            display: none;
            animation: slideIn 0.3s ease-out;
            font-family: monospace;
        ">
            Notification Example
        </div>
    </div>

    <script>
        // Matrix Background Animation
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        
        // Set canvas size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        resizeCanvas();
        
        // Matrix characters
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$+-*/=%"\'#&_(),.;:?!\\|{}<>[]^~';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);
        
        // Draw matrix effect
        function drawMatrix() {
            // Fade effect
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Green text
            ctx.fillStyle = '#00ff00';
            ctx.font = `${fontSize}px monospace`;
            
            // Draw characters
            for (let i = 0; i < drops.length; i++) {
                const char = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(char, i * fontSize, drops[i] * fontSize);
                
                // Reset randomly
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        
        // Start animation
        const matrixInterval = setInterval(drawMatrix, 50);
        
        // Handle window resize
        window.addEventListener('resize', () => {
            resizeCanvas();
        });
        
        // Show notification example
        setTimeout(() => {
            const notification = document.getElementById('notification');
            notification.style.display = 'block';
            notification.textContent = '🎯 System Ready!';
            
            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }, 1000);
        
        // Add hover class to cards
        document.querySelectorAll('.hover-card').forEach(card => {
            card.addEventListener('mouseenter', function() {
                this.classList.add('neon-glow');
            });
            
            card.addEventListener('mouseleave', function() {
                this.classList.remove('neon-glow');
            });
        });
    </script>
</body>
</html>
